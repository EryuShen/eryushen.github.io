<style>
:root{
  --page:#E9ECF1; --slide:#FFFFFF; --navy:#13294B; --ink:#1B2433; --ink-2:#465163; --muted:#6B7686; --rule:#D8DDE5; --tint:#F3F5F8;
  --amber:#F7DA8E; --ok:#2E7D5B; --ok-bg:#E5F2EC; --warn:#9A6200; --warn-bg:#FDF1D6; --bad:#B3261E; --bad-bg:#FBE4E2;
  --font:"Source Sans 3","Segoe UI","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #3D74D6;outline-offset:3px;border-radius:4px}
h1,h2{margin:0;font-weight:700;letter-spacing:-.01em;color:var(--navy)}
h1{font-size:clamp(34px,5vw,48px);line-height:1.08}
h2{font-size:clamp(23px,2.8vw,29px);line-height:1.2}
h1:focus,h2:focus{outline:none}
p{margin:0}

/* portfolio bar, outside the training frame */
.pf{max-width:1180px;margin:0 auto;padding:12px clamp(10px,2.5vw,28px) 0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 20px;font-size:14px;color:var(--ink-2)}
.pf a{color:var(--navy);font-weight:600;text-decoration:none}
.pf a:hover{text-decoration:underline;text-underline-offset:3px}
.pf span{color:var(--muted)}
.pf span a{font-weight:600}
.framed .pf{display:none}

/* the deck frame */
.outer{max-width:1180px;margin:0 auto;padding:clamp(10px,2.5vw,28px)}
.deck{background:var(--slide);border:1px solid var(--rule);border-radius:6px;box-shadow:0 1px 2px rgba(19,41,75,.06);display:flex;flex-direction:column;min-height:min(640px,calc(100vh - 40px))}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding:16px clamp(18px,3.5vw,40px);border-bottom:3px solid var(--navy)}
.brand{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink-2)}
.brand .mark{width:30px;height:30px;border-radius:4px;background:var(--navy);display:flex;align-items:center;justify-content:center}
.brand b{color:var(--navy);font-weight:700}
.body{flex-grow:1;padding:clamp(22px,4vw,44px) clamp(18px,3.5vw,40px)}
.foot{display:flex;justify-content:space-between;gap:12px;padding:12px clamp(18px,3.5vw,40px);border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}

/* the clock: the one loud thing */
.clock{display:flex;align-items:center;gap:16px;padding:8px 14px;border-radius:8px;background:var(--tint);border:1px solid var(--rule);position:relative;min-height:56px}
.clock .now{font-size:28px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.clock .side{display:flex;flex-direction:column;gap:6px;min-width:170px}
.clock .left{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.clock .left b{color:var(--ink)}
.track{height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--navy);transition:width .9s cubic-bezier(.3,.7,.3,1),background .3s}
.clock.low{background:var(--warn-bg);border-color:#EBCB86}.clock.low .fill{background:#C98A10}.clock.low .now{color:var(--warn)}
.clock.late{background:var(--bad-bg);border-color:#EAB3AE}.clock.late .now{color:var(--bad)}.clock.late .left b{color:var(--bad)}
.minus{position:absolute;right:12px;top:-14px;background:var(--bad);color:#fff;font-weight:700;font-size:15px;border-radius:999px;padding:3px 10px;animation:drop 1.6s ease-out forwards}
@keyframes drop{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.clock.shake{animation:shake .5s}
@keyframes shake{25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}

/* layout inside a slide */
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(22px,4vw,48px);align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px}
.kicker{font-size:14px;font-weight:600;color:var(--muted)}
.lead{font-size:clamp(17px,1.8vw,19px);color:var(--ink-2);max-width:34em}

/* people */
.person{display:flex;gap:12px;align-items:flex-start}
.person svg{flex:none;width:64px;height:64px;border-radius:50%}
.person .name{font-size:14px;color:var(--muted)}
.person .name b{color:var(--ink);font-weight:600}
.bubble{background:var(--tint);border-radius:4px 12px 12px 12px;padding:12px 16px;font-size:16px;margin-top:4px;max-width:34em}
.bubble.dark{background:var(--navy);color:#fff}
.bubble.coach{background:var(--ok-bg)}
.bubble.think{background:#fff;border:1px dashed var(--rule)}

/* workplace artifacts */
.win{border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:#fff}
.win .wt{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--tint);border-bottom:1px solid var(--rule);padding:8px 14px;font-size:13px;color:var(--ink-2)}
.win .wb{padding:16px;display:flex;flex-direction:column;gap:12px;font-size:15px}
.q{align-self:flex-end;max-width:85%;background:var(--navy);color:#fff;border-radius:10px 10px 2px 10px;padding:10px 14px}
.a{align-self:flex-start;max-width:92%;background:var(--tint);border-radius:10px 10px 10px 2px;padding:12px 14px;line-height:1.55}
mark{background:var(--amber);color:inherit;font-weight:700;padding:0 3px;border-radius:2px}
.sheet{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;font-size:13px;border:1px solid var(--rule)}
.sheet div{padding:6px 8px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
.sheet div:nth-child(4n){border-right:0}
.sheet .h{background:var(--tint);font-weight:600}
.conf{font-size:13px;font-weight:600;color:var(--bad)}
.src{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:8px}
ol.r{margin:4px 0 0;padding-left:20px}

/* choices */
.choice{display:flex;gap:14px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--rule);border-radius:6px;padding:13px 16px;min-height:58px;font-size:17px;line-height:1.35;cursor:pointer;width:100%}
.choice:hover{border-color:var(--navy);background:var(--tint)}
.choice .k{flex:none;width:28px;height:28px;border-radius:4px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.choice .t{flex-grow:1}
.choice .c{flex:none;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:12px 26px;min-height:50px;font-weight:600;font-size:17px;cursor:pointer;align-self:flex-start}
.btn:hover{background:#0C1D38}
.btn.line{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}

/* outcome */
.event{border:1px solid var(--rule);border-left:6px solid var(--navy);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.event .when{font-size:14px;font-weight:600;color:var(--muted)}
.event .say{font-size:clamp(20px,2.3vw,24px);font-weight:700;line-height:1.3;color:var(--navy)}
.event.bad{border-left-color:var(--bad)}.event.ok{border-left-color:#C98A10}.event.good{border-left-color:var(--ok)}
.pill{align-self:flex-start;font-size:14px;font-weight:600;border-radius:4px;padding:3px 10px}
.pill.good{background:var(--ok-bg);color:var(--ok)}.pill.ok{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}

/* debrief + wrap */
table.db{width:100%;border-collapse:collapse;font-size:15px}
table.db th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--navy);padding:6px 8px}
table.db td{border-bottom:1px solid var(--rule);padding:10px 8px;vertical-align:top}
.score{display:inline-flex;gap:3px}.score i{width:10px;height:10px;border-radius:2px;background:var(--rule)}.score i.f{background:var(--navy)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.checks{grid-template-columns:1fr}.clock .side{min-width:130px}}
.check{border:1px solid var(--rule);border-top:4px solid var(--navy);border-radius:4px;padding:14px 16px}
.check b{display:block;color:var(--navy);font-size:17px;margin-bottom:4px}
.check span{font-size:15px;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cite{background:none;border:0;padding:0;color:#2457B8;text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:inherit}
.peek{font-size:14px;background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:8px 12px}
.task{display:flex;flex-direction:column;gap:14px}
.searchbar{display:flex;gap:10px;align-items:center}
.searchbar .fieldv{flex-grow:1;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;font-size:15px;background:#fff}
.result{border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.result .u{font-size:13px;color:var(--ok)}
.result b{color:#2457B8;font-size:17px}
.none{font-size:15px;color:var(--bad);background:var(--bad-bg);border-radius:4px;padding:10px 12px}
.redact{width:100%;border-collapse:collapse;font-size:15px}
.redact th{padding:0;border-bottom:2px solid var(--navy)}
.redact th button{width:100%;text-align:left;background:var(--tint);border:0;border-right:1px solid #fff;padding:10px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.redact th button[aria-pressed="true"]{background:var(--ink);color:#fff}
.redact td{padding:9px 10px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
.redact td.x span{background:var(--ink);color:transparent;border-radius:2px;user-select:none}
.status{font-size:15px;min-height:24px;color:var(--ink-2)}
.status.good{color:var(--ok);font-weight:600}.status.bad{color:var(--bad)}
.arts{display:grid;gap:10px}
.art{border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.art .src2{font-size:13px;color:var(--muted);margin-bottom:6px}
.sent{display:block;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:5px 6px;margin:2px -6px;font-size:15px;line-height:1.45;cursor:pointer}
.sent:hover{background:var(--tint)}
.sent.got{background:var(--amber);font-weight:600}
.sent.seen{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.btn[disabled]{background:var(--rule);color:var(--muted);cursor:not-allowed}
.zone{display:flex;flex-direction:column;gap:14px;border-radius:8px;padding:18px 20px 20px}
.zlab{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;align-self:flex-start;border-radius:4px;padding:4px 10px}
.scenez{background:#E6EBF3;border:1px solid #D3DBE7}
.scenez .zlab{background:#fff;color:var(--ink-2)}
.scenez .bubble.think{background:#fff}
.choosez{background:#fff;border:2px solid var(--navy);box-shadow:0 6px 18px rgba(19,41,75,.10)}
.choosez .zlab{background:var(--navy);color:#fff}
.choosez .choice{border-color:#B9C3D2}
.lapse{display:flex;flex-direction:column;align-items:center;gap:16px}
.lapse svg.scene{width:100%;max-width:760px;height:auto;border-radius:6px;background:#EEF1F6}
.lcap{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:8px 18px;text-align:center}
.lcap b{font-size:20px;color:var(--navy)}
.lcap .dig{font-size:30px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.lcap .dig.late{color:var(--bad)}
.skip{background:none;border:1px solid var(--rule);border-radius:6px;padding:8px 16px;min-height:44px;font-size:15px;color:var(--ink-2);cursor:pointer}
.hand{transform-box:view-box;transform-origin:520px 96px;animation:spin 2.6s cubic-bezier(.45,.05,.4,1) forwards}
@keyframes spin{from{transform:rotate(var(--a0))}to{transform:rotate(var(--a1))}}
.pop{opacity:0;animation:pop .35s ease-out forwards}
@keyframes pop{to{opacity:1}}
.cell{opacity:0;animation:pop .2s linear forwards}
.slide-in{animation:slidein 1.2s ease-out .5s both}
@keyframes slidein{from{transform:translateX(220px)}to{transform:translateX(0)}}
.scan{animation:scan 1.3s ease-in-out infinite alternate}
@keyframes scan{from{transform:translate(0,0)}to{transform:translate(110px,46px)}}
.flip{transform-box:fill-box;transform-origin:center bottom;animation:flip .45s ease-in-out infinite alternate}
@keyframes flip{from{transform:scaleY(1)}to{transform:scaleY(.15)}}
.fly{animation:fly 1.6s ease-in .3s both}
@keyframes fly{from{transform:translate(0,0)}to{transform:translate(70px,-70px);opacity:.2}}
.blink{animation:blink .5s steps(2) 1.4s infinite}
@keyframes blink{50%{opacity:0}}
.type{animation:typing .9s steps(2) infinite}
@keyframes typing{50%{transform:translateY(2px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="pf" aria-label="Portfolio"><a href="../">← Eryu Shen, portfolio</a><span>A branching scenario I designed and built for the <a href="../responsible-ai/">Before It Goes to the Client</a> course. Larkmoor Advisory and its people are fictional.</span></nav>
<div class="outer"><div class="deck" id="deck"></div></div>
<div class="sr" id="announce" aria-live="polite"></div>

<script>
/* ---------- people (illustrated, no photos) ---------- */
function face(o, mood){
  mood = mood || "smile";
  const cap = `<path d="M19.5 28c1-8 6-13 12.5-13s11.5 5 12.5 13c-3.5-3.2-7.5-4.8-12.5-4.8s-9 1.6-12.5 4.8z" fill="${o.hair}"/>`;
  const back = {
    long:`<path d="M14 33c0-13 8-21 18-21s18 8 18 21v19H14z" fill="${o.hair}"/>`,
    bun:`<circle cx="32" cy="12" r="6" fill="${o.hair}"/>`,
    curly:`<circle cx="20" cy="25" r="6" fill="${o.hair}"/><circle cx="44" cy="25" r="6" fill="${o.hair}"/><circle cx="25" cy="17" r="6" fill="${o.hair}"/><circle cx="39" cy="17" r="6" fill="${o.hair}"/>`,
    short:""
  }[o.style];
  const ink = "#1B2433";
  const mouths = {
    smile:`<path d="M28.5 36.2c2.2 1.6 4.8 1.6 7 0" fill="none" stroke="${ink}" stroke-width="1.3" stroke-linecap="round"/>`,
    happy:`<path d="M27.6 35.4c2.4 3 6.4 3 8.8 0z" fill="${ink}"/>`,
    neutral:`<path d="M29 36.6h6" stroke="${ink}" stroke-width="1.3" stroke-linecap="round"/>`,
    worried:`<path d="M28.6 37.6c2.2-1.6 4.6-1.6 6.8 0" fill="none" stroke="${ink}" stroke-width="1.3" stroke-linecap="round"/>`,
    stern:`<path d="M28.8 36.8h6.4" stroke="${ink}" stroke-width="1.5" stroke-linecap="round"/>`
  };
  const brows = {
    worried:`<path d="M24.6 26.6l4.2-1.4M39.4 26.6l-4.2-1.4" stroke="${ink}" stroke-width="1.3" stroke-linecap="round"/>`,
    stern:`<path d="M24.8 25.6l4.2 1.4M39.2 25.6l-4.2 1.4" stroke="${ink}" stroke-width="1.4" stroke-linecap="round"/>`,
    happy:`<path d="M25 26.2c1.4-.9 2.8-.9 4.2 0M34.8 26.2c1.4-.9 2.8-.9 4.2 0" fill="none" stroke="${ink}" stroke-width="1.2" stroke-linecap="round"/>`
  };
  const eyes = `<circle cx="27.5" cy="31" r="1.4" fill="${ink}"/><circle cx="36.5" cy="31" r="1.4" fill="${ink}"/>${brows[mood] || ""}${mouths[mood] || mouths.smile}`;
  const glasses = o.glasses ? `<g fill="none" stroke="${ink}" stroke-width="1.4"><circle cx="27.5" cy="31" r="3.6"/><circle cx="36.5" cy="31" r="3.6"/><path d="M31.1 31h1.8"/></g>` : "";
  return `<svg viewBox="0 0 64 64" role="img" aria-label="${o.label}"><rect width="64" height="64" fill="${o.bg}"/>${back}<path d="M10 64c2-11 11-17 22-17s20 6 22 17z" fill="${o.shirt}"/><rect x="27.5" y="40" width="9" height="9" fill="${o.skin}"/><circle cx="32" cy="30" r="12" fill="${o.skin}"/>${cap}${eyes}${glasses}</svg>`;
}
const P = {
  maya:   { name:"Maya", role:"Analyst, 3 months in", look:{label:"Maya", bg:"#DCE6F5", skin:"#E8B992", hair:"#2B1D16", style:"long", shirt:"#13294B"} },
  daniel: { name:"Daniel", role:"Partner", look:{label:"Daniel", bg:"#E6E2D8", skin:"#C68A62", hair:"#3A2A20", style:"short", shirt:"#5B6B82", glasses:true} },
  priya:  { name:"Priya", role:"Senior associate", look:{label:"Priya", bg:"#DDEFE6", skin:"#B9805A", hair:"#1C1412", style:"bun", shirt:"#2E7D5B"} },
  laura:  { name:"Laura", role:"VP Strategy, client", look:{label:"Laura", bg:"#F3E1DF", skin:"#F0C8A8", hair:"#A86A32", style:"curly", shirt:"#7A2E2A"} }
};
function say(who, text, kind, note, mood){
  const p = P[who];
  return `<div class="person">${face(p.look, mood)}<div><div class="name"><b>${p.name}</b>, ${p.role}${note ? `, ${note}` : ""}</div><div class="bubble ${kind || ""}">${text}</div></div></div>`;
}

/* ---------- content ---------- */
const START_MIN = 16*60 + 12, DUE_MIN = 18*60;
const D = [
  {
    slide: "Decision 1 of 3: the market size",
    title: "What does Maya do with this number?",
    think: "That was fast. Is it right?",
    context: () => `<div class="win"><div class="wt"><span>Firm AI assistant</span><span>4:12 p.m.</span></div><div class="wb">
      <div class="q">How big is the US plant-based snack market, and how fast is it growing?</div>
      <div class="a">It's worth <mark>$12.4 billion</mark> and growing <mark>18% a year</mark> (<button class="cite" data-act="cite">Nielsen, 2024</button>).</div>${S.cite ? `<div class="peek">No link attached. The assistant didn't say where to find this report.</div>` : ""}</div></div>`,
    options: [
      { t:"Paste it into slide 2 and keep going", act:"paste", cap:"Maya pastes the number into slide 2", cost:2, score:0, who:"laura", when:"Monday, 9:40 a.m., in the client meeting",
        line:"Where does the $12.4 billion come from?",
        what:"Maya looks for the Nielsen report on her laptop. It doesn't exist. Daniel has to take the number back in front of the client.",
        coach:"This happens a lot. AI tools will cite reports that don't exist. If you can't open the source, the number can't go on a slide. Finding it would have taken 20 minutes, and you had them." },
      { t:"Ask the AI: \"Are you sure? Where's this from?\"", act:"askai", cap:"Maya asks the AI to double-check", cost:3, score:1, who:"maya", when:"auto",
        line:"\"Yes, this comes from Nielsen's 2024 market report.\" Same number. Still no link.",
        what:"The AI sounds even more sure of itself, but there's still nothing Maya can open and check.",
        coach:"Asking the AI if it's sure usually gets you the same answer, just more confident. It can't check itself. You need a source you can open." },
      { t:"Find the Nielsen report before using it", act:"search", cap:"Maya searches for the Nielsen report", cost:20, score:2, who:"maya", when:"auto", task:"search",
        line:"There's no such report. The Snack Industry Council puts it at $9.1 billion, growing 11%.",
        what:"Maya uses that figure and puts the real source in the footnote.",
        coach:"Good catch. That's the habit: every number on a slide needs a source you've opened yourself." }
    ]
  },

function nest(svg, x, y, w){ return svg.replace('<svg viewBox="0 0 64 64"', `<svg x="${x}" y="${y}" width="${w}" height="${w}" viewBox="0 0 64 64"`); }

  if (act === "askai") screen = `<rect x="292" y="128" width="156" height="86" fill="#fff"/><g class="pop" style="animation-delay:.3s"><rect x="362" y="136" width="78" height="18" rx="6" fill="#13294B"/></g><g class="pop" style="animation-delay:1.1s"><rect x="300" y="162" width="96" height="18" rx="6" fill="#E2E7EF"/></g><g class="pop" style="animation-delay:1.8s"><rect x="300" y="186" width="70" height="18" rx="6" fill="#F7DA8E"/></g>`;

  }
  if (act === "upload") screen = `<rect x="292" y="128" width="156" height="86" fill="#fff"/><path d="M392 156a14 14 0 0 1 27-4a11 11 0 0 1 3 22h-32a10 10 0 0 1 2-18z" fill="#E2E7EF"/><g class="fly"><rect x="318" y="170" width="28" height="34" rx="3" fill="#2E7D5B"/><rect x="324" y="178" width="16" height="3" fill="#fff"/><rect x="324" y="185" width="16" height="3" fill="#fff"/></g><g class="blink"><circle cx="430" cy="140" r="9" fill="#B3261E"/><rect x="429" y="134" width="2" height="7" fill="#fff"/><rect x="429" y="143" width="2" height="2" fill="#fff"/></g>`;
  if (act === "excel") { let cells = ""; let k = 0; for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) { cells += `<rect class="cell" style="animation-delay:${(k++)*0.075}s" x="${300 + c*24}" y="${134 + r*15}" width="22" height="13" fill="${r === 0 ? "#13294B" : (c === 5 ? "#F7DA8E" : "#DDE6DF")}"/>`; } screen = `<rect x="292" y="128" width="156" height="86" fill="#fff"/>` + cells; }
  if (act === "approved") screen = `<rect x="292" y="128" width="156" height="86" fill="#fff"/><rect x="302" y="140" width="60" height="64" fill="#fff" stroke="#C9D1DC"/>${[0,1,2,3].map(i => `<rect class="cell" style="animation-delay:${.4 + i*.15}s" x="308" y="${148 + i*13}" width="22" height="7" fill="#1B2433"/><rect x="334" y="${148 + i*13}" width="22" height="7" fill="#C9D1DC"/>`).join("")}<g class="pop" style="animation-delay:1.4s"><path d="M404 142l22 8v18c0 14-10 22-22 26c-12-4-22-12-22-26v-18z" fill="#2E7D5B"/><path d="M394 167l7 7l14-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>`;

    <rect x="282" y="118" width="176" height="106" rx="6" fill="#1B2433"/>${screen}<rect x="356" y="224" width="28" height="6" fill="#1B2433"/>
    <rect x="196" y="212" width="80" height="10" rx="2" fill="#5B6B82" class="type"/>

}

function tod(min){ const h = Math.floor(min/60), m = min % 60, hh = ((h + 11) % 12) + 1; return `${hh}:${String(m).padStart(2,"0")} ${h >= 12 ? "p.m." : "a.m."}`; }
function dur(m){ const a = Math.abs(m), h = Math.floor(a/60), r = a % 60; return `${h ? h + " h " : ""}${h && !r ? "" : r + " min"}`.trim(); }
function clockHTML(){
  const now = START_MIN + S.used, left = DUE_MIN - now, total = DUE_MIN - START_MIN;
  const pct = Math.max(0, left) / total * 100;
  const cls = left < 0 ? "late" : left <= 30 ? "low" : "";
  const txt = left < 0 ? `<b>${dur(left)} late</b> for the 6:00 deadline` : `<b>${dur(left)}</b> until the deck is due`;
  return `<div class="clock ${cls}" id="clock" aria-label="Time: ${tod(now)}. ${left < 0 ? dur(left) + " late" : dur(left) + " left"}"><div class="now">${tod(now)}</div><div class="side"><div class="left">${txt}</div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>${S.drop ? `<span class="minus" aria-hidden="true">−${dur(S.drop)}</span>` : ""}</div>`;
}
function frame(inner, footL, footR, showClock){

}

  else if (S.screen === "wrap") {
    h = frame(`<div class="col" style="gap:22px">
      <div class="two" style="align-items:center"><div class="col"><span class="kicker">Before you go</span><h2 tabindex="-1">Four checks before anything goes to a client</h2></div>
        <div class="col">${say("priya","Use AI. Just check it before it goes out. Most of these take a few minutes, and they're the difference between Monday going well or not.","coach","","happy")}</div></div>
      <div class="checks">
        <div class="check"><b>1. Should AI do this?</b><span>Low stakes and easy to check: let AI draft. Needs judgment or accountability: keep it human.</span></div>
        <div class="check"><b>2. Protect the client</b><span>Only firm-approved tools, and only the data the task needs. Take out names and account numbers.</span></div>
        <div class="check"><b>3. Check for the three errors</b><span>Made-up facts, bias, and anything the summary left out. Open the sources.</span></div>
        <div class="check"><b>4. Own it</b><span>Rewrite in your words, cite real sources, and ask before it goes out if you're unsure.</span></div>
      </div>
      <div class="row"><button class="btn line" data-act="again">Replay the scenario</button><span class="kicker">The printable checklist is in the next lesson.</span></div>
    </div>`, "Larkmoor Advisory, internal training", "10", false);
  }
  deck.innerHTML = h;
  const head = deck.querySelector("h1, h2"); if (head) head.focus({preventScroll:true});
  if (S.drop) { const c = document.getElementById("clock"); if (c) { c.classList.add("shake"); } S.drop = 0; }
}

deck.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const a = b.dataset.act;
  if (a === "start") S.screen = "setup";
  else if (a === "go") { S.screen = "decide"; S.step = 0; }
  else if (a === "skip") { endLapse(); return; }
  else if (a === "cite") { S.cite = true; render(); return; }
  else if (a === "search") { S.searched = true; }
  else if (a === "use" || a === "send" || a === "addrisk") { S.screen = "result"; S.msg = ""; S.tone = ""; }
  else if (b.dataset.col !== undefined) {
    const c = Number(b.dataset.col);
    if (S.red.includes(c)) { S.red = S.red.filter(x => x !== c); S.msg = ""; S.tone = ""; }
    else if (SENSITIVE.includes(c)) { S.red.push(c); const done = SENSITIVE.every(i => S.red.includes(i)); S.msg = done ? "Customer names and account numbers are out. The tool only sees what it needs." : "Good. Anything else that identifies the client's customers?"; S.tone = done ? "good" : ""; }
    else { S.msg = `You'll need "${COLS[c]}" for the analysis. Keep it.`; S.tone = "bad"; }
    render(); const btn = deck.querySelector(`[data-col="${c}"]`); if (btn) btn.focus(); return;
  }
  else if (b.dataset.sent !== undefined) {
    const id = b.dataset.sent, [ai, si] = id.split("-").map(Number), kind = ARTS[ai].s[si][1];
    if (kind === "miss") { S.found = true; S.msg = "Found it. The summary skipped the new labeling rules, and two articles cover them."; S.tone = "good"; }
    else { if (!S.seen.includes(id)) S.seen.push(id); S.msg = kind === "in" ? "That one's already in the summary." : "Interesting, but it's not a risk."; S.tone = ""; }
    render(); const nb = deck.querySelector(`[data-sent="${id}"]`); if (nb) nb.focus(); return;
  }
  else if (b.dataset.pick !== undefined) {
    const i = Number(b.dataset.pick), o = D[S.step].options[i];
    const from = START_MIN + S.used;
    S.picks[S.step] = i; S.last = i; S.trust += o.score; S.used += o.cost;
    if (REDUCED) { S.drop = o.cost; S.screen = o.task ? "task" : "result"; }
    else { S.lapse = { act:o.act, cap:o.cap, from, to: from + o.cost }; S.screen = "lapse"; render(); runLapse(); return; }
    const left = DUE_MIN - (START_MIN + S.used);
    announce.textContent = `${costLabel(o.cost)} used. It's ${tod(START_MIN + S.used)}. ${left < 0 ? dur(left) + " late." : dur(left) + " left."}`;
  }
  else if (a === "next") { if (S.step < 2) { S.step++; S.screen = "decide"; } else S.screen = "end"; }
  else if (a === "wrap") S.screen = "wrap";
  else if (a === "again") { reset(); S.screen = "setup"; }
  render();
  deck.scrollIntoView({block:"start"});
});
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let lapseTimer = null, lapseRaf = null;
function runLapse(){
  const L = S.lapse, t0 = performance.now(), dur = 2600, dig = () => document.getElementById("dig");
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
    const m = Math.round(L.from + (L.to - L.from) * e), el = dig();
    if (el) { el.textContent = tod(m); el.classList.toggle("late", m > DUE_MIN); }
    if (k < 1) lapseRaf = requestAnimationFrame(step);
  };
  lapseRaf = requestAnimationFrame(step);
  lapseTimer = setTimeout(endLapse, dur + 700);
}
function endLapse(){
  if (S.screen !== "lapse") return;
  clearTimeout(lapseTimer); cancelAnimationFrame(lapseRaf);
  const o = D[S.step].options[S.last];
  S.drop = o.cost; S.screen = o.task ? "task" : "result"; render(); deck.scrollIntoView({block:"start"});
}
render();
</script>
